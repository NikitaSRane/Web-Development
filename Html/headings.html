<!DOCTYPE html>
<html>
    <head>
        <title>Headings</title>
    </head>
    <body>
        <h1>Headings without css</h1> 
        <br>
        <h1>This is Heading1 </h1>
        <h2>This is Heading2 </h2>
        <h3>This is Heading3 </h3>
        <h4>This is Heading4 </h4>
        <h5>This is Heading5 </h5>
        <h6>This is Heading6 </h6>
        <br>
        <h1>Headings with css</h1> 
        <br>
        <h1 style="font-size: small;">This is Heading1 </h1>
        <h2 style="font-size: large;">This is Heading2 </h2>
        <h3 style="font-size: large;">This is Heading3 </h3>
        <h4 style="font-size: large;">This is Heading4 </h4>
        <h5 style="font-size: large;">This is Heading5 </h5>
        <h6 style="font-size: large;">This is Heading6 </h6>
    </body>
</html>
