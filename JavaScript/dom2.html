<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic webpage</title>
</head>

<body>
    <!-- select byTagName -->
    <h1>This is dynamic webpage</h1>
    <h1>This is h1-1</h1>
    <h1>This is h1-2</h1>

    <!-- select byId-->
    <p id="first_id">This is paragraph</p>   
    
    <!-- select byClass-->
     <div class="div_class">This is container-1</div>
     <div class="div_class">This is container-2</div>


    <!--select using querySelector -->
    <p>This is for querySelector</p>
    <p>This is for another</p>

    <!-- Difference in innerText, innerHtml, textContent-->

    <h2>This is h2 <span style="display: none; font-style: italic;">heading</span></h2>


    <script src="dom2.js"></script>
</body>

</html>
