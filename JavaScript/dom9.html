<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="dom9.css">
</head>
<body>
    <!-- inline events -->
    <button onclick="console.log('Button was clicked.'), alert('Hello')">Submit</button>
    <button ondblclick="alert('Double clicked')">Reset</button>
    <div class="box" onmouseover="console.log('You are inside div')">This is box</div>

    <!-- handing events using js -->
     <button id="btn">Click</button>
     <div id="div" class="box">This is container</div>
     <script src="dom9.js"></script>
</body>
</html>
